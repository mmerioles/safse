[project]
name = "safse"
version = "1.0.0"
description = "Species-Aware Fish Length Estimation from Images"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "ECE228 Team 72" }]
dependencies = [
  "ipykernel>=6.30.0",
  "matplotlib>=3.10.9",
  "numpy>=2.4.6",
  "opencv-python",
  "pandas>=2.3.0",
  "pillow>=11.3.0",
  "pytest",
  "scikit-learn>=1.8.0",
  "scipy>=1.17.1",
  "seaborn>=0.13.2",
  "tensorflow>=2.21.0",
  "tensorflow-hub>=0.16.1",
  "tf-keras>=2.21.0",
  "torch>=2.12.0",
  "torchvision>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
